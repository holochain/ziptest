    - name: ziptest
      path: ../../../target/wasm32-unknown-unknown/release/ziptest.wasm
      dependencies:
        - name: ziptest_integrity
    - name: profiles
      path: ../../../target/wasm32-unknown-unknown/release/profiles.wasm
      dependencies:
        - name: profiles_integrity
    - name: dht_util
      path: ../../../target/wasm32-unknown-unknown/release/dht_util.wasm
      dependencies: []
